name: nix flake check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}.${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5
        with:
          install_options: --no-daemon
          extra_nix_config: |
            extra-trusted-substituters = http://127.0.0.1
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@3c034b51a9deec0a09ef1df8b436ac5db50fae94 # main@2026-04-15 (node24)
        with:
          use-flakehub: false
      - name: Check .nix formatting
        run: nix fmt -- --fail-on-change
      - name: Check nix flake show runs successfully
        run: nix flake show --all-systems
      - name: Run nix flake check (no build)
        run: nix flake check --option allow-import-from-derivation false --no-build --all-systems
  discover_nixos_configurations:
    name: Discover NixOS configurations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5
        with:
          install_options: --no-daemon
          extra_nix_config: |
            extra-trusted-substituters = http://127.0.0.1
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@3c034b51a9deec0a09ef1df8b436ac5db50fae94 # main@2026-04-15 (node24)
        with:
          use-flakehub: false
      - name: Discover targets
        id: discover
        run: |
          set -euo pipefail
          targets="$(nix eval --json --apply 'builtins.attrNames' .#nixosConfigurations)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Discovered nixosConfigurations: $targets"
  nixos_build_matrix:
    name: "nixos build"
    needs:
      - check
      - discover_nixos_configurations
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJson(needs.discover_nixos_configurations.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          df -h
      - name: Install nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5
        with:
          install_options: --no-daemon
          extra_nix_config: |
            extra-trusted-substituters = http://127.0.0.1
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@3c034b51a9deec0a09ef1df8b436ac5db50fae94 # main@2026-04-15 (node24)
        with:
          use-flakehub: false
      - name: Build target '${{ matrix.target }}'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            (*[!A-Za-z0-9_-]*|'')
              echo "Invalid nixosConfigurations target: $TARGET" >&2
              exit 1
              ;;
          esac

          build_attr=".#nixosConfigurations.${TARGET}.config.system.build.toplevel"
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            if nix build "$build_attr" --no-link; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Build failed after $max_attempts attempts for target: $TARGET" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 15))
            echo "Retrying target $TARGET in ${sleep_seconds}s (attempt $((attempt + 1))/$max_attempts)..." >&2
            sleep "$sleep_seconds"
          done
