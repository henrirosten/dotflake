name: flakevuln

on:
  pull_request:
    paths:
      - ".github/workflows/flakevuln.yml"
      - "flake.nix"
      - "flake.lock"
      - "flake/**"
      - "hosts/**"
      - "modules/**"
      - "users/**"
  workflow_dispatch:
  schedule:
    # 03:47 Europe/Helsinki every day, stable across DST changes
    - cron: "47 3 * * *"
      timezone: "Europe/Helsinki"

concurrency:
  group: ${{ github.workflow }}.${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan-x1:
    name: Scan x1 vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run flakevuln
        uses: tiiuae/flakevuln@9a98dd90933c5250a34f86db580ca6d9f8ed41d1
        with:
          targets: |
            nixosConfigurations.x1.config.system.build.toplevel
          unstable-ref: github:NixOS/nixpkgs/nixos-unstable
          nixprs: true
