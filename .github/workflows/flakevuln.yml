name: flakevuln

on:
  workflow_dispatch:
  schedule:
    # 03:47 Europe/Helsinki every day, stable across DST changes
    - cron: "47 3 * * *"
      timezone: "Europe/Helsinki"

concurrency:
  group: ${{ github.workflow }}.${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan-x1:
    name: Scan x1 vulnerabilities
    if: github.repository == 'henrirosten/dotflake'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run flakevuln
        uses: tiiuae/flakevuln@a2ac15097e3d7524ca2384d43cde50b199965781
        with:
          targets: |
            nixosConfigurations.x1.config.system.build.toplevel
          unstable-ref: github:NixOS/nixpkgs/nixos-unstable
          whitelist: .github/flakevuln/manual_analysis.csv
          nixprs: true

      - name: Upload flakevuln findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flakevuln-findings-${{ github.run_id }}
          path: ${{ runner.temp }}/flakevuln/findings.json
          if-no-files-found: warn
          retention-days: 30
