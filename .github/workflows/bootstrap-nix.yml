name: bootstrap nix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bootstrap-nix.sh"
      - ".github/workflows/bootstrap-nix.yml"
      - "flake.nix"
      - "flake.lock"
      - "modules/home/**"
      - "users/**"

jobs:
  lint-bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run shellcheck
        run: shellcheck bootstrap-nix.sh

      - name: Run shfmt check
        run: shfmt -d -i 2 bootstrap-nix.sh

  bootstrap-integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner preflight
        run: |
          sudo -n true
          lsb_release -a || cat /etc/os-release

      - name: Run bootstrap script
        id: bootstrap
        continue-on-error: true
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 45m bash ./bootstrap-nix.sh |& tee bootstrap.log

      - name: Assert bootstrap result
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
        run: |
          if [ "$BOOTSTRAP_OUTCOME" != "success" ]; then
            echo "bootstrap-nix.sh failed"
            exit 1
          fi

      - name: Enable Magic Nix Cache
        id: magic_nix_cache
        continue-on-error: true
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main@2026-04-15 (node24)
        with:
          use-flakehub: false

      - name: Note Magic Nix Cache failure
        if: steps.magic_nix_cache.outcome == 'failure'
        run: |
          echo "::warning::Magic Nix Cache failed to import cache paths; continuing without cache."

      - name: Verify nix is installed and configured
        run: |
          set -euo pipefail
          command -v nix
          command -v nix-shell
          nix --version
          sudo systemctl is-active nix-daemon
          test -S /nix/var/nix/daemon-socket/socket
          grep -q "experimental-features = nix-command flakes" /etc/nix/nix.conf
          nix flake metadata .
          nix build .#homeConfigurations.hrosten.activationPackage -L

      - name: Upload bootstrap log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-log-${{ matrix.os }}
          path: bootstrap.log
          if-no-files-found: ignore
