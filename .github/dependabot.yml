version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    groups:
      nix-flake-inputs:
        patterns:
          - "*"
